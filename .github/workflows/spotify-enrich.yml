name: Daily Spotify enrichment

# 01:03 UTC daily (odd minute avoids the :00 thundering herd).
# Moved from a local cron 2026-07-08 so runs no longer depend on a machine
# being awake. Schedule-only plus manual dispatch; no PR triggers (public repo).
on:
  schedule:
    - cron: '3 1 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check D1 access without running enrichment
        type: boolean
        default: false

concurrency:
  group: spotify-enrich

jobs:
  verify:
    if: inputs.verify_only == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-d1-access.mjs
        env:
          GOSPEL_D1_DATABASE_ID: ${{ vars.GOSPEL_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOSPEL_D1_API_TOKEN: ${{ secrets.GOSPEL_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  enrich:
    if: inputs.verify_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec vitest run scripts/__tests__/enrich-spotify-by-church-name.test.mjs

      # Phase 1: re-run the strict matcher on legacy unverified matches.
      # No-op once the legacy pool is drained; capped to leave quota for phase 2.
      - name: Phase 1 revalidate-legacy
        env:
          GOSPEL_D1_DATABASE_ID: ${{ vars.GOSPEL_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOSPEL_D1_API_TOKEN: ${{ secrets.GOSPEL_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/enrich-spotify-by-church-name.mjs --revalidate-legacy --limit=50 --throttle=400 --concurrency=2

      # Brief pause between bursts to ease aggregate rate-limit pressure.
      - run: sleep 60

      - name: Phase 2 daily enrichment
        env:
          GOSPEL_D1_DATABASE_ID: ${{ vars.GOSPEL_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOSPEL_D1_API_TOKEN: ${{ secrets.GOSPEL_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/enrich-spotify-by-church-name.mjs --daily --daily-limit=500 --throttle=400 --concurrency=2
