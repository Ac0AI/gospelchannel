name: Nightly directory reconciliation

# 02:33 UTC daily: after the 01:03 Spotify enrichment (which changes playlist
# counts and thus directory scores) and before the site's 04:00 cache flush,
# so the flushed caches re-fill with freshly reconciled ranks.
#
# Why this exists: churches.directory_rank and related_church_slugs are
# materialized snapshots of the live browse comparator. The code always
# assumed a nightly reconciliation ("reconcile after imports/bulk-approve +
# nightly") but nothing ran it, so ranks drifted daily and the reciprocity
# invariant (every indexable church receives >=1 inlink) eroded to 43k
# orphans by 2026-07-19. Both are Node-only jobs that cannot run as Worker
# crons (isolate OOM), hence GitHub Actions.
#
# Started at 02:33 UTC by the Worker cron (worker.ts → src/lib/reconcile-dispatch.ts),
# because GitHub starts scheduled workflows hours late (5-7 h in November 2026)
# and the job then ran in the middle of the day's traffic. The schedule below
# stays as the fallback: it skips itself when a run already succeeded in the
# last 20 hours, and runs (late) if the Worker dispatch ever stops working.
on:
  schedule:
    - cron: '33 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reconcile-directory

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow reconcile-directory.yml --status success \
            --limit 10 --json createdAt -q "[.[] | select(.createdAt > \"$since\")] | length")
          if [ "${recent:-0}" -gt 0 ]; then
            echo "Already reconciled in the last 20 h (started by the Worker cron); skipping the late schedule."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run in the last 20 h; the late schedule runs the reconcile."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  reconcile:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Reconcile facet columns (directory_rank, directory_score, city_slug)
        env:
          GOSPEL_D1_DATABASE_ID: ${{ vars.GOSPEL_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOSPEL_D1_API_TOKEN: ${{ secrets.GOSPEL_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec tsx scripts/backfill-facet-columns.ts

      # Reads the columns reconciled above. Facet pages, hub pages and the
      # sitemap read this table instead of aggregating per request.
      - name: Build precomputed facet links
        env:
          GOSPEL_D1_DATABASE_ID: ${{ vars.GOSPEL_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOSPEL_D1_API_TOKEN: ${{ secrets.GOSPEL_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec tsx scripts/build-facet-links.ts

      - name: Reconcile related churches (reciprocity invariant)
        env:
          GOSPEL_D1_DATABASE_ID: ${{ vars.GOSPEL_D1_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOSPEL_D1_API_TOKEN: ${{ secrets.GOSPEL_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec tsx scripts/backfill-related-churches.ts
