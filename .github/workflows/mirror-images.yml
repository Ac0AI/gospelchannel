name: Nightly image mirror

# 02:47 UTC daily, clear of the Spotify enrichment (01:03) and the Worker
# crons. Mirrors rotating Google image hosts to R2 so stored DB URLs stay
# permanent. Moved from a local cron 2026-07-08. Steady-state this is a
# no-op scan; the limit caps a sudden backlog.
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

concurrency:
  group: mirror-images

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Mirror foreign images
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          # wrangler (spawned per upload by src/lib/r2-mirror.ts) picks these up.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/backfill-mirror-foreign-images.ts --limit=2000
